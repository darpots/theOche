name: Refresh player profiles

on:
  schedule:
    - cron: '30 4 * * *' # daily, 04:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:rankings
      - run: npm run data:players
      - run: npm run data:live-race
      - run: npm run data:images
      # Unit tests: a failure stops the commit below and opens an issue.
      - run: npm test
      - uses: ./.github/actions/commit
        with:
          message: 'data: refresh player profiles and tournament history'
          paths: src/data public/data data public/avatars public/cutouts
      - if: failure()
        uses: ./.github/actions/report-failure
        with:
          job: player profiles
