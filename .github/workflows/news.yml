name: Newsdesk (API writer + cleanup)

on:
  schedule:
    # News goes out twice a day, at 5am and 5pm UK time (matches are played in the
    # afternoon and evening). Cron runs in UTC, so both GMT and BST hours are listed
    # and the first step skips the run that isn't 5 o'clock in London.
    - cron: '0 4,5,16,17 * * *'
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: How far back to look for stories
        default: '48'

permissions:
  contents: write
  issues: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Only at 5am or 5pm UK time
        id: gate
        run: |
          h=$(TZ=Europe/London date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$h" = "05" ] || [ "$h" = "17" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "UK hour is $h: not a news slot"; echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.go == 'true'
        run: npm ci
      - if: steps.gate.outputs.go == 'true'
        name: Write new reports and remove old ones
        run: npm run news
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          NEWS_API_URL: ${{ vars.NEWS_API_URL }}
          NEWS_MODEL: ${{ vars.NEWS_MODEL }}
          NEWS_LOOKBACK_HOURS: ${{ inputs.lookback_hours || '48' }}
      - if: steps.gate.outputs.go == 'true'
        uses: ./.github/actions/commit
        with:
          message: 'news: newsdesk update'
          paths: src/content/news
      - if: failure()
        uses: ./.github/actions/report-failure
        with:
          job: newsdesk
