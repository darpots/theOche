name: Newsdesk (API writer + cleanup)

on:
  schedule:
    # Twice a day, after 5am and after 5pm UK time (matches are played in the
    # afternoon and evening). An outside scheduler (cron-job.org) starts it on time
    # through workflow_dispatch; this GitHub schedule is the backup, and GitHub often
    # runs it hours late, so the gate below accepts the whole morning or evening.
    - cron: '0 5,17 * * *'
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: How far back to look for stories
        default: '48'

permissions:
  contents: write
  issues: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Morning or evening edition only (UK time)
        id: gate
        run: |
          # 05:00-11:59 or 17:00-23:59 in London. Pruning old stories is safe to repeat,
          # so a late or second run in the same window does no harm.
          h=$((10#$(TZ=Europe/London date +%H)))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ $h -ge 5 ] && [ $h -lt 12 ]; } || [ $h -ge 17 ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "UK hour is $h: outside the news windows"; echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.go == 'true'
        run: npm ci
      - if: steps.gate.outputs.go == 'true'
        name: Write new reports and remove old ones
        run: npm run news
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          NEWS_API_URL: ${{ vars.NEWS_API_URL }}
          NEWS_MODEL: ${{ vars.NEWS_MODEL }}
          NEWS_LOOKBACK_HOURS: ${{ inputs.lookback_hours || '48' }}
      # Unit tests: a failure stops the commit below and opens an issue.
      - if: steps.gate.outputs.go == 'true'
        run: npm test
      - if: steps.gate.outputs.go == 'true'
        uses: ./.github/actions/commit
        with:
          message: 'news: newsdesk update'
          paths: src/content/news
      - if: failure()
        uses: ./.github/actions/report-failure
        with:
          job: newsdesk
