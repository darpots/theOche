name: Refresh calendar, rankings & matches

on:
  schedule:
    - cron: '7 * * * *' # hourly
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:fast
      # Unit tests: a failure stops the commit below and opens an issue.
      - run: npm test
      # A televised event type with no channel mapping is shown with a guessed
      # channel; open one issue (once) so someone can confirm it.
      - name: Flag new TV event types
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s .unmapped-broadcasters.txt ] || exit 0
          title="New TV event type: confirm the broadcaster"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          [ -n "$existing" ] || gh issue create --title "$title" --body "$(cat .unmapped-broadcasters.txt)"
      # The live race checks itself each time the PDC republishes its rankings,
      # and watches for event types it doesn't count: open one issue for each.
      - name: Flag live race problems
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flag() {
            [ -s "$1" ] || return 0
            existing=$(gh issue list --state open --search "in:title \"$2\"" --json number --jq '.[0].number')
            [ -n "$existing" ] || gh issue create --title "$2" --body "$(cat "$1")"
          }
          flag .live-race-check.txt "Live race: prediction differed from the official rankings"
          flag .unknown-event-types.txt "Live race: new PDC event type to check"
      - uses: ./.github/actions/commit
        with:
          message: 'data: refresh calendar, rankings and current tournament'
          paths: src/data
      - if: failure()
        uses: ./.github/actions/report-failure
        with:
          job: calendar, rankings & matches
